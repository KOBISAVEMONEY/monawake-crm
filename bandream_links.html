<style>

  .link-btn { width:100%;display:flex;align-items:center;gap:14px;padding:16px 20px;border-radius:14px;text-decoration:none;transition:all 0.25s ease;cursor:pointer;border:none;font-family:'Noto Sans TC',sans-serif; }

  .btn-secondary .btn-icon { background:rgba(255,255,255,0.06); }
  .btn-text { flex:1;text-align:left; }

  .btn-primary .btn-title { color:#c8a84b; }
  .btn-secondary .btn-title { color:rgba(255,255,255,0.8); }
  .btn-sub { font-size:11px;letter-spacing:1px; }

  .btn-secondary .btn-sub { color:rgba(255,255,255,0.35); }
  .btn-arrow { font-size:16px;flex-shrink:0; }

  .footer { text-align:center; }
  .footer-quote { font-family:'Noto Serif TC',serif;font-size:13px;color:rgba(200,168,75,0.4);letter-spacing:3px;line-height:2;margin-bottom:16px;font-weight:300; }
  .footer-note { font-size:11px;color:rgba(255,255,255,0.2);letter-spacing:2px; }
