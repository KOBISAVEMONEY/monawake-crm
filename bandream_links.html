<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500&family=Noto+Sans+TC:wght@300;400&display=swap');

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  body {
    background: #1a1b2e;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Noto Sans TC', sans-serif;
    padding: 40px 24px;
    position: relative;
    overflow-x: hidden;
  }

  /* 星點背景 */
  .stars {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  .star {
    position: absolute;
    background: #ffffff;
    border-radius: 50%;
    animation: twinkle 3s infinite alternate;
  }

  @keyframes twinkle {
    0% { opacity: 0.15; }
    100% { opacity: 0.6; }
  }

  /* 底部光暈 */
  .glow {
    position: fixed;
    bottom: -60px;
    left: 50%;
    transform: translateX(-50%);
    width: 500px;
    height: 250px;
    background: radial-gradient(ellipse, rgba(200,168,75,0.08) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* 主容器 */
  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  /* ICON */
  .icon-wrap {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: #1e2347;
    border: 1.5px solid rgba(200,168,75,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
    box-shadow: 0 0 30px rgba(200,168,75,0.1);
    overflow: hidden;
  }

  .icon-wrap svg {
    width: 100px;
    height: 100px;
  }

  /* 品牌名 */
  .brand-name {
    font-family: 'Noto Serif TC', serif;
    font-size: 26px;
    color: #c8a84b;
    letter-spacing: 6px;
    margin-bottom: 6px;
    text-align: center;
  }

  .brand-en {
    font-size: 11px;
    color: rgba(200,168,75,0.5);
    letter-spacing: 4px;
    margin-bottom: 16px;
    text-align: center;
  }

  /* 一句話 */
  .tagline {
    font-size: 14px;
    color: rgba(255,255,255,0.55);
    letter-spacing: 2px;
    line-height: 2;
    text-align: center;
    margin-bottom: 36px;
    font-family: 'Noto Serif TC', serif;
    font-weight: 300;
  }

  /* 分隔線 */
  .divider {
    width: 100%;
    height: 1px;
    background: linear-gradient(to right, transparent, rgba(200,168,75,0.2), transparent);
    margin-bottom: 32px;
  }

  /* 按鈕群組 */
  .links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-bottom: 36px;
  }

  .link-btn {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 20px;
    border-radius: 14px;
    text-decoration: none;
    transition: all 0.25s ease;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    border: none;
    font-family: 'Noto Sans TC', sans-serif;
  }

  .link-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.25s;
  }

  .link-btn:active::before { opacity: 1; }

  /* 主要按鈕：說說話 */
  .btn-primary {
    background: rgba(200,168,75,0.12);
    border: 1px solid rgba(200,168,75,0.35);
  }

  .btn-primary:hover, .btn-primary:active {
    background: rgba(200,168,75,0.2);
    border-color: rgba(200,168,75,0.6);
    transform: translateY(-1px);
    box-shadow: 0 4px 20px rgba(200,168,75,0.15);
  }

  /* 次要按鈕 */
  .btn-secondary {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
  }

  .btn-secondary:hover, .btn-secondary:active {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.2);
    transform: translateY(-1px);

  .btn-icon {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 20px;
  }

  .btn-primary .btn-icon { background: rgba(200,168,75,0.15); }
  .btn-secondary .btn-icon { background: rgba(255,255,255,0.06); }

  .btn-text {

    text-align: left;

  .btn-title {

    font-weight: 500;
    letter-spacing: 1px;
    margin-bottom: 2px;
  }

  .btn-primary .btn-title { color: #c8a84b; }
  .btn-secondary .btn-title { color: rgba(255,255,255,0.8); }

  .btn-sub {
    font-size: 11px;
    letter-spacing: 1px;
  }

  .btn-primary .btn-sub { color: rgba(200,168,75,0.55); }
  .btn-secondary .btn-sub { color: rgba(255,255,255,0.35); }

  .btn-arrow {
