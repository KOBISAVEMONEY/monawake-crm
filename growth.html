<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>伴夢伴醒 · 獲客行事曆</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500&family=Noto+Sans+TC:wght@300;400;500&display=swap');
  :root {
    --bg:#1a1b2e; --bg2:#20213a; --bg3:#272848;
    --gold:#c8a84b; --gold2:rgba(200,168,75,0.15);
    --white:rgba(255,255,255,0.88); --dim:rgba(255,255,255,0.45);
    --red:#e07070; --green:#70c090; --yellow:#e0c070;
    --border:rgba(200,168,75,0.18);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { background:var(--bg); color:var(--white); font-family:'Noto Sans TC',sans-serif; min-height:100vh; max-width:600px; margin:0 auto; }

  .top-nav { position:sticky; top:0; z-index:50; background:var(--bg); border-bottom:1px solid var(--border); padding:12px 16px; display:flex; align-items:center; gap:8px; overflow-x:auto; }
  .top-nav::-webkit-scrollbar { display:none; }
  .nav-brand { font-family:'Noto Serif TC',serif; font-size:14px; color:var(--gold); letter-spacing:2px; flex-shrink:0; margin-right:4px; }
  .nav-tab { padding:7px 12px; border-radius:20px; font-size:12px; cursor:pointer; border:1px solid var(--border); color:var(--dim); background:transparent; font-family:'Noto Sans TC',sans-serif; letter-spacing:1px; transition:all 0.2s; white-space:nowrap; flex-shrink:0; }
  .nav-tab.active { background:var(--gold2); border-color:var(--gold); color:var(--gold); }

  .page { display:none; padding:16px; }
  .page.active { display:block; }

  .loading { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:60px 20px; gap:16px; }
  .loading-text { color:var(--gold); font-family:'Noto Serif TC',serif; font-size:16px; letter-spacing:4px; }
  .spinner { width:28px; height:28px; border:2px solid var(--border); border-top-color:var(--gold); border-radius:50%; animation:spin 0.8s linear infinite; }
  @keyframes spin { to{transform:rotate(360deg)} }

  .section-title { font-size:12px; color:var(--gold); letter-spacing:3px; margin-bottom:10px; margin-top:20px; display:flex; align-items:center; gap:8px; }
  .section-title::after { content:''; flex:1; height:1px; background:var(--border); }
  .section-title:first-child { margin-top:0; }

  .add-btn { background:var(--gold2); border:1px solid var(--gold); color:var(--gold); padding:9px 16px; border-radius:8px; cursor:pointer; font-size:13px; font-family:'Noto Sans TC',sans-serif; letter-spacing:1px; width:100%; margin-bottom:16px; }

  /* Stats overview */
  .stats { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:16px; }
  .stat { background:var(--bg2); border:1px solid var(--border); border-radius:12px; padding:14px; text-align:center; }
  .stat-num { font-size:22px; font-weight:500; color:var(--gold); font-family:'Noto Serif TC',serif; }
  .stat-label { font-size:11px; color:var(--dim); margin-top:3px; letter-spacing:1px; }

  /* Chart */
  .chart-card { background:var(--bg2); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:16px; }
  .chart-title { font-size:12px; color:var(--dim); letter-spacing:1px; margin-bottom:12px; }
  canvas { max-height:220px; }

  /* Toggle buttons for chart metric */
  .metric-toggle { display:flex; gap:6px; margin-bottom:12px; overflow-x:auto; }
  .metric-toggle::-webkit-scrollbar { display:none; }
  .metric-btn { padding:5px 12px; border-radius:16px; font-size:11px; cursor:pointer; border:1px solid var(--border); color:var(--dim); background:transparent; white-space:nowrap; flex-shrink:0; }
  .metric-btn.active { background:var(--gold2); border-color:var(--gold); color:var(--gold); }

  /* Entry cards (Reels log) */
  .entry-card { background:var(--bg2); border:1px solid var(--border); border-radius:12px; padding:14px 16px; margin-bottom:10px; }
  .entry-top { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:8px; }
  .entry-day { font-size:14px; color:var(--gold); font-weight:500; }
  .entry-date { font-size:11px; color:var(--dim); margin-top:2px; }
  .entry-actions { display:flex; gap:6px; }
  .entry-btn { background:rgba(255,255,255,0.04); border:1px solid var(--border); color:var(--dim); padding:4px 10px; border-radius:6px; font-size:11px; cursor:pointer; }
  .entry-btn.del { background:rgba(224,112,112,0.06); border-color:rgba(224,112,112,0.2); color:var(--red); }
  .entry-theme { font-size:13px; color:var(--white); margin-bottom:10px; padding:8px 10px; background:var(--bg3); border-radius:8px; }
  .entry-metrics { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
  .metric-box { background:var(--bg3); border-radius:8px; padding:6px; text-align:center; }
  .metric-val { font-size:15px; color:var(--gold); font-weight:500; }
  .metric-lbl { font-size:9px; color:var(--dim); margin-top:2px; }

  /* Idea cards */
  .idea-card { background:var(--bg2); border:1px solid var(--border); border-radius:12px; padding:14px 16px; margin-bottom:10px; }
  .idea-top { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:6px; }
  .idea-title { font-size:14px; color:var(--white); font-weight:500; flex:1; }
  .idea-tag { font-size:10px; color:var(--dim); background:var(--bg3); padding:2px 8px; border-radius:10px; white-space:nowrap; }
  .idea-desc { font-size:13px; color:rgba(255,255,255,0.65); line-height:1.7; white-space:pre-wrap; }
  .idea-actions { display:flex; gap:6px; margin-top:10px; }

  /* Platform totals */
  .platform-card { background:var(--bg2); border:1px solid var(--border); border-radius:12px; padding:14px 16px; margin-bottom:10px; display:flex; align-items:center; gap:12px; }
  .platform-icon { width:40px; height:40px; border-radius:10px; background:var(--gold2); display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
  .platform-info { flex:1; }
  .platform-name { font-size:13px; color:var(--white); margin-bottom:2px; }
  .platform-sub { font-size:11px; color:var(--dim); }
  .platform-num { font-size:22px; color:var(--gold); font-family:'Noto Serif TC',serif; font-weight:500; }
  .platform-edit { background:rgba(255,255,255,0.04); border:1px solid var(--border); color:var(--dim); padding:4px 10px; border-radius:6px; font-size:11px; cursor:pointer; margin-left:8px; }

  .empty { text-align:center; color:var(--dim); font-size:13px; padding:30px; letter-spacing:1px; }

  /* Generator */
  .gen-controls { margin-bottom:16px; }
  #gen-btn:disabled { opacity:0.5; cursor:not-allowed; }
  .gen-status-box { display:flex; align-items:center; gap:10px; padding:16px; color:var(--dim); font-size:13px; }
  .gen-spinner { width:18px; height:18px; border:2px solid var(--border); border-top-color:var(--gold); border-radius:50%; animation:spin 0.8s linear infinite; flex-shrink:0; }
  .gen-error { color:var(--red); font-size:13px; padding:12px 16px; background:rgba(224,112,112,0.08); border:1px solid rgba(224,112,112,0.2); border-radius:10px; margin-bottom:12px; }

  .option-card { background:var(--bg2); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:12px; cursor:pointer; transition:border-color 0.2s; }
  .option-card:active { border-color:var(--gold); }
  .option-num { font-size:11px; color:var(--gold); letter-spacing:2px; margin-bottom:6px; }
  .option-quote { font-family:'Noto Serif TC',serif; font-size:16px; color:var(--gold); margin-bottom:8px; }
  .option-preview { font-size:13px; color:rgba(255,255,255,0.65); line-height:1.7; }
  .option-pick-btn { margin-top:12px; width:100%; background:var(--gold2); border:1px solid var(--gold); color:var(--gold); padding:10px; border-radius:8px; font-size:13px; cursor:pointer; font-family:'Noto Sans TC',sans-serif; }

  .gen-result { background:var(--bg2); border:1px solid var(--border); border-radius:12px; padding:18px; margin-top:16px; }
  .gen-result-title { font-size:12px; color:var(--gold); letter-spacing:2px; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center; }
  .gen-block { margin-bottom:16px; }
  .gen-block-label { font-size:11px; color:var(--dim); letter-spacing:1px; margin-bottom:6px; display:flex; justify-content:space-between; align-items:center; }
  .gen-block-text { font-size:13px; color:rgba(255,255,255,0.8); line-height:1.8; white-space:pre-wrap; padding:10px 12px; background:var(--bg3); border-radius:8px; }
  .gen-slide { margin-bottom:8px; }
  .gen-slide-num { font-size:10px; color:var(--dim); margin-bottom:3px; }
  .gen-copy-btn { background:var(--gold2); border:1px solid rgba(200,168,75,0.3); color:var(--gold); padding:3px 10px; border-radius:6px; font-size:10px; cursor:pointer; }
  .gen-copy-btn.copied { background:rgba(112,192,144,0.2); border-color:rgba(112,192,144,0.4); color:var(--green); }
  .gen-save-btn { width:100%; background:var(--gold); color:var(--bg); border:none; border-radius:10px; padding:14px; cursor:pointer; font-size:14px; font-weight:500; margin-top:8px; font-family:'Noto Sans TC',sans-serif; }
  .gen-back-btn { width:100%; background:transparent; color:var(--dim); border:1px solid var(--border); border-radius:10px; padding:12px; cursor:pointer; font-size:13px; margin-top:8px; font-family:'Noto Sans TC',sans-serif; }

  /* Modal */
  .modal-overlay { display:none; position:fixed; top:0;left:0;right:0;bottom:0; background:rgba(0,0,0,0.8); z-index:200; justify-content:center; align-items:flex-end; }
  .modal-overlay.show { display:flex; }
  .modal { background:var(--bg2); border:1px solid var(--border); border-radius:20px 20px 0 0; padding:24px 20px 36px; width:100%; max-width:600px; max-height:92vh; overflow-y:auto; }
  .drag-handle { width:40px; height:4px; background:var(--border); border-radius:2px; margin:0 auto 20px; }
  .modal h3 { font-family:'Noto Serif TC',serif; color:var(--gold); font-size:16px; letter-spacing:2px; margin-bottom:20px; text-align:center; }
  .form-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .form-group { margin-bottom:14px; }
  .form-group label { display:block; font-size:12px; color:var(--dim); letter-spacing:1px; margin-bottom:6px; }
  .form-group input, .form-group select, .form-group textarea { width:100%; background:var(--bg3); border:1px solid var(--border); border-radius:8px; padding:12px; color:var(--white); font-size:14px; font-family:'Noto Sans TC',sans-serif; outline:none; }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color:var(--gold); }
  .form-group select option { background:var(--bg2); }
  .modal-btns { display:flex; gap:10px; margin-top:20px; }
  .btn-primary { flex:1; background:var(--gold); color:var(--bg); border:none; border-radius:10px; padding:14px; cursor:pointer; font-size:14px; font-weight:500; font-family:'Noto Sans TC',sans-serif; }
  .btn-cancel { flex:1; background:transparent; color:var(--dim); border:1px solid var(--border); border-radius:10px; padding:14px; cursor:pointer; font-size:14px; font-family:'Noto Sans TC',sans-serif; }
</style>
</head>
<body>

<div class="top-nav">
  <div class="nav-brand">伴夢伴醒</div>
  <button class="nav-tab active" data-page="overview">總覽</button>
  <button class="nav-tab" data-page="generate">生成內容</button>
  <button class="nav-tab" data-page="reels">Reels記錄</button>
  <button class="nav-tab" data-page="platforms">平台總數</button>
  <button class="nav-tab" data-page="ideas">內容靈感</button>
</div>

<div id="loading">
  <div class="loading"><div class="spinner"></div><div class="loading-text">連線中</div></div>
</div>

<div id="app" style="display:none">

  <!-- 總覽頁 -->
  <div class="page active" id="page-overview">
    <div class="section-title">本週概況</div>
    <div class="stats">
      <div class="stat"><div class="stat-num" id="ov-total-views">0</div><div class="stat-label">Reels總觀看</div></div>
      <div class="stat"><div class="stat-num" id="ov-avg-views">0</div><div class="stat-label">平均觀看/篇</div></div>
      <div class="stat"><div class="stat-num" id="ov-entries">0</div><div class="stat-label">已記錄天數</div></div>
      <div class="stat"><div class="stat-num" id="ov-ideas">0</div><div class="stat-label">內容靈感庫</div></div>
    </div>

    <div class="section-title">趨勢圖</div>
    <div class="chart-card">
      <div class="metric-toggle">
        <button class="metric-btn active" onclick="setMetric('views',this)">觀看次數</button>
        <button class="metric-btn" onclick="setMetric('reach',this)">觸及帳號</button>
        <button class="metric-btn" onclick="setMetric('avgTime',this)">平均觀看(秒)</button>
        <button class="metric-btn" onclick="setMetric('likes',this)">讚數</button>
      </div>
      <canvas id="trendChart"></canvas>
    </div>

    <div class="section-title">最新記錄</div>
    <div id="ov-recent"></div>
  </div>

  <!-- 生成內容頁 -->
  <div class="page" id="page-generate">
    <div class="gen-controls">
      <div class="form-group">
        <label>想要的主題方向（選填，留空讓AI自由發揮）</label>
        <input type="text" id="gen-direction" placeholder="例：職場、感情、自我價值、社群焦慮...">
      </div>
      <button class="add-btn" id="gen-btn" onclick="generateContent()">✨ 生成 3 個今日內容選項</button>
    </div>
    <div id="gen-status"></div>
    <div id="gen-options"></div>
    <div id="gen-selected"></div>
  </div>

  <!-- Reels記錄頁 -->
  <div class="page" id="page-reels">
    <button class="add-btn" onclick="openReelModal()">+ 新增今日 Reels 記錄</button>
    <div id="reels-list"></div>
  </div>

  <!-- 平台總數頁 -->
  <div class="page" id="page-platforms">
    <div class="section-title">各平台目前數字</div>
    <div id="platforms-list"></div>
  </div>

  <!-- 內容靈感頁 -->
  <div class="page" id="page-ideas">
    <button class="add-btn" onclick="openIdeaModal()">+ 新增內容靈感</button>
    <div id="ideas-list"></div>
  </div>

</div>

<!-- Reel Modal -->
<div class="modal-overlay" id="reel-modal">
  <div class="modal">
    <div class="drag-handle"></div>
    <h3 id="reel-modal-title">新增 Reels 記錄</h3>
    <div class="form-row">
      <div class="form-group"><label>Day</label><input type="text" id="r-day" placeholder="例：Day6"></div>
      <div class="form-group"><label>日期</label><input type="date" id="r-date"></div>
    </div>
    <div class="form-group"><label>內容主題</label><input type="text" id="r-theme" placeholder="例：不應住色生心 - 社群比較版"></div>
    <div class="form-row">
      <div class="form-group"><label>觀看次數</label><input type="number" id="r-views" placeholder="0"></div>
      <div class="form-group"><label>觸及帳號</label><input type="number" id="r-reach" placeholder="0"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>平均觀看(秒)</label><input type="number" id="r-avgtime" placeholder="0"></div>
      <div class="form-group"><label>讚數</label><input type="number" id="r-likes" placeholder="0"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>留言數</label><input type="number" id="r-comments" placeholder="0"></div>
      <div class="form-group"><label>收藏數</label><input type="number" id="r-saves" placeholder="0"></div>
    </div>
    <div class="form-group"><label>新增粉絲</label><input type="number" id="r-newfollowers" placeholder="0"></div>
    <div class="form-group"><label>備註/觀察</label><textarea id="r-note" rows="2" placeholder="例：用了自己的YouTube音樂當背景"></textarea></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeReelModal()">取消</button>
      <button class="btn-primary" onclick="saveReel()">儲存</button>
    </div>
  </div>
</div>

<!-- Platform Modal -->
<div class="modal-overlay" id="platform-modal">
  <div class="modal">
    <div class="drag-handle"></div>
    <h3>更新平台數字</h3>
    <div class="form-group"><label id="p-name-label">平台名稱</label><input type="number" id="p-value" placeholder="0"></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closePlatformModal()">取消</button>
      <button class="btn-primary" onclick="savePlatform()">儲存</button>
    </div>
  </div>
</div>

<!-- Idea Modal -->
<div class="modal-overlay" id="idea-modal">
  <div class="modal">
    <div class="drag-handle"></div>
    <h3 id="idea-modal-title">新增內容靈感</h3>
    <div class="form-group"><label>標題</label><input type="text" id="i-title" placeholder="例：半夜刷手機"></div>
    <div class="form-group"><label>分類</label>
      <select id="i-tag">
        <option value="待製作">待製作（AI生成）</option>
        <option value="經文">經文方向</option>
        <option value="生活比喻">生活比喻</option>
        <option value="待嘗試">待嘗試主題</option>
        <option value="其他">其他</option>
      </select>
    </div>
    <div class="form-group"><label>內容描述</label><textarea id="i-desc" rows="4" placeholder="記下你的想法..."></textarea></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeIdeaModal()">取消</button>
      <button class="btn-primary" onclick="saveIdea()">儲存</button>
    </div>
  </div>
</div>

<script>
// 立即綁定分頁切換，不依賴 module script 載入完成
document.addEventListener('DOMContentLoaded', function() {
  document.querySelectorAll('.nav-tab').forEach(btn => {
    btn.addEventListener('click', function() {
      const page = this.dataset.page;
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
      document.getElementById('page-' + page).classList.add('active');
      this.classList.add('active');
      if (page === 'overview' && window.renderChart) window.renderChart();
    });
  });
});
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, setDoc, getDoc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDvokbEafyLb7s5KihFJ1PSvy4assuzeb0",
  authDomain: "monawake-c5c69.firebaseapp.com",
  projectId: "monawake-c5c69",
  storageBucket: "monawake-c5c69.firebasestorage.app",
  messagingSenderId: "159548017770",
  appId: "1:159548017770:web:eeb75db8f1043295824e13",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const reelsRef = collection(db, 'growth_reels');
const ideasRef = collection(db, 'growth_ideas');
const platformsRef = doc(db, 'growth_platforms', 'main');

let reels = [];
let ideas = [];
let platforms = {
  youtube: 0, ig_followers: 0, threads: 0, line: 0
};
let editReelId = null;
let editIdeaId = null;
let editPlatformKey = null;
let currentMetric = 'views';
let chartInstance = null;
let loadedCount = 0;

function checkAllLoaded() {
  loadedCount++;
  if (loadedCount >= 3) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'block';
  }
}

// Listen to reels
onSnapshot(query(reelsRef, orderBy('date', 'asc')), snap => {
  reels = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  renderAll();
  checkAllLoaded();
});

// Listen to ideas
onSnapshot(query(ideasRef, orderBy('createdAt', 'desc')), snap => {
  ideas = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  renderIdeas();
  checkAllLoaded();
});

// Listen to platforms
onSnapshot(platformsRef, snap => {
  if (snap.exists()) {
    platforms = { ...platforms, ...snap.data() };
  }
  renderPlatforms();
  checkAllLoaded();
});

function renderAll() {
  renderOverview();
  renderReelsList();
}

// ===== Overview =====
function renderOverview() {
  const totalViews = reels.reduce((s, r) => s + (Number(r.views) || 0), 0);
  const avgViews = reels.length ? Math.round(totalViews / reels.length) : 0;
  document.getElementById('ov-total-views').textContent = totalViews.toLocaleString();
  document.getElementById('ov-avg-views').textContent = avgViews.toLocaleString();
  document.getElementById('ov-entries').textContent = reels.length;
  document.getElementById('ov-ideas').textContent = ideas.length;

  const recentEl = document.getElementById('ov-recent');
  const recent = [...reels].slice(-3).reverse();
  if (!recent.length) {
    recentEl.innerHTML = '<div class="empty">還沒有記錄，去「Reels記錄」新增第一筆吧</div>';
  } else {
    recentEl.innerHTML = recent.map(r => reelCardHtml(r, true)).join('');
  }

  renderChart();
}

function renderChart() {
  const ctx = document.getElementById('trendChart');
  const labels = reels.map(r => r.day || r.date);
  const metricMap = {
    views: 'views', reach: 'reach', avgTime: 'avgtime', likes: 'likes'
  };
  const field = metricMap[currentMetric];
  const data = reels.map(r => Number(r[field]) || 0);

  if (chartInstance) chartInstance.destroy();
  chartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: currentMetric,
        data,
        borderColor: '#c8a84b',
        backgroundColor: 'rgba(200,168,75,0.1)',
        fill: true,
        tension: 0.3,
        pointBackgroundColor: '#c8a84b',
        pointRadius: 4,
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: 'rgba(255,255,255,0.5)', font: { size: 10 } }, grid: { color: 'rgba(255,255,255,0.05)' } },
        y: { ticks: { color: 'rgba(255,255,255,0.5)', font: { size: 10 } }, grid: { color: 'rgba(255,255,255,0.05)' } }
      }
    }
  });
}

window.setMetric = function(metric, btn) {
  currentMetric = metric;
  document.querySelectorAll('.metric-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderChart();
}

// ===== Content Generator =====
const SYSTEM_PROMPT = `你是「伴夢伴醒」這個品牌的內容寫手。這是一個結合金剛經智慧與現代生活比喻的 Instagram 內容系列，叫做「一日一句金剛經」。

品牌調性與規則（必須嚴格遵守）：
- 使用繁體字，絕對不能出現任何簡體字
- 絕對不能使用「樹洞」這個詞
- 不說教、不給直接建議，而是用「你是不是也這樣」的方式引發共鳴，陪伴讀者「看見」自己的狀態，不是教讀者「應該怎麼做」
- 語氣溫柔、有質感，像一個看透了但不說破的朋友
- 不使用 emoji
- 最容易引起共鳴與高觸及的內容主題，是「當下正在發生的小動作」（例如：已讀不回、打字打到一半刪掉、半夜刷手機），而不是抽象的「人生哲理」層級主題（例如：人生方向、選擇焦慮）。這類具體、即時、每個人都在經歷的場景效果最好。

內容結構（四段式，每段對應輪播一張）：
第1張：描述一個具體的生活場景/小動作，引發「啊，我也這樣」的共鳴
第2張：用一個貼切的生活比喻，延伸這個感受（比喻要非常生活化、具體，像是：打翻的水、已經寄出的信、修過光的照片，不要用太抽象的比喻）
第3張：點出對應的金剛經經文，用白話解釋經文跟前面場景的關聯
第4張：收尾的金句，給讀者一個溫柔的、不說教的提醒或轉念角度

請根據使用者提供的方向（如果有），生成 3 個不同的內容選項。如果使用者沒給方向，請自由發揮，但優先選擇「當下正在發生的小動作」類型的主題。

每個選項請用以下 JSON 格式回覆，整個回覆必須是一個 JSON 陣列，不要有任何其他文字、不要用 markdown 的 \`\`\`json 包裹，直接輸出純 JSON：

[
  {
    "quote": "經文原句（4-12字精簡版，適合手寫）",
    "fullQuote": "經文完整版（如果跟quote不同的話，否則填一樣的）",
    "previewText": "一句話預覽這個選項在講什麼情境（給使用者快速判斷用，15字以內）",
    "slides": [
      "第1張文字內容（用換行符號\\n分段，模擬詩句排版）",
      "第2張文字內容",
      "第3張文字內容",
      "第4張文字內容"
    ],
    "igCaption": "IG貼文文案，整合四張內容成一段連貫文字，最後加上 hashtag：#伴夢伴醒 #金剛經 #一日一句 #手寫文字 #文字療癒 #你還好嗎 加上2-3個跟主題相關的hashtag",
    "threadsText": "Threads文字，取輪播中最有力的1-2句金句，簡短",
    "reelsScript": "Reels影片口播文字稿，格式為：隨手抽一支筆，寫下今天的金剛經\\n「經文」\\n你們知道是什麼意思嗎？\\n簡單來說——[一句話帶過經文意思]\\n有點難懂對吧？\\n晚上用一個小例子，解釋給你聽\\n——\\n一日一句金剛經\\n用古老的智慧\\n說現代人的心事"
  }
]`;

window.generateContent = async function() {
  const direction = document.getElementById('gen-direction').value.trim();
  const btn = document.getElementById('gen-btn');
  const statusEl = document.getElementById('gen-status');
  const optionsEl = document.getElementById('gen-options');
  const selectedEl = document.getElementById('gen-selected');

  btn.disabled = true;
  optionsEl.innerHTML = '';
  selectedEl.innerHTML = '';
  statusEl.innerHTML = '<div class="gen-status-box"><div class="gen-spinner"></div><div>正在生成內容，請稍候...</div></div>';

  const userMsg = direction
    ? `請幫我生成今天的內容，主題方向：${direction}`
    : `請幫我生成今天的內容，主題自由發揮，優先選擇當下正在發生的小動作類型。`;

  try {
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 4000,
        system: SYSTEM_PROMPT,
        messages: [{ role: "user", content: userMsg }],
      })
    });
    const data = await response.json();
    const textBlock = data.content.find(b => b.type === 'text');
    if (!textBlock) throw new Error('AI 沒有回傳文字內容');

    let cleaned = textBlock.text.trim().replace(/^```json\s*/i, '').replace(/```\s*$/,'').trim();
    const options = JSON.parse(cleaned);

    statusEl.innerHTML = '';
    renderOptions(options);
  } catch (e) {
    statusEl.innerHTML = `<div class="gen-error">生成失敗：${e.message}<br>請再試一次，或檢查網路連線</div>`;
  } finally {
    btn.disabled = false;
  }
}

function renderOptions(options) {
  const optionsEl = document.getElementById('gen-options');
  optionsEl.innerHTML = options.map((opt, idx) => `
    <div class="option-card">
      <div class="option-num">選項 ${idx + 1}</div>
      <div class="option-quote">「${opt.quote}」</div>
      <div class="option-preview">${opt.previewText}</div>
      <button class="option-pick-btn" onclick="pickOption(${idx})">選這個，展開完整內容</button>
    </div>
  `).join('');
  window._genOptions = options;
}

window.pickOption = function(idx) {
  const opt = window._genOptions[idx];
  document.getElementById('gen-options').innerHTML = '';
  const selectedEl = document.getElementById('gen-selected');

  selectedEl.innerHTML = `
    <div class="gen-result">
      <div class="gen-result-title">「${opt.fullQuote}」</div>

      ${opt.slides.map((s, i) => `
        <div class="gen-block gen-slide">
          <div class="gen-block-label">
            <span>第${i+1}張</span>
            <button class="gen-copy-btn" onclick="copyGenText(this, ${JSON.stringify(s).replace(/"/g,'&quot;')})">複製</button>
          </div>
          <div class="gen-block-text">${escapeHtml(s)}</div>
        </div>
      `).join('')}

      <div class="gen-block">
        <div class="gen-block-label">
          <span>IG 貼文文案</span>
          <button class="gen-copy-btn" onclick="copyGenText(this, ${JSON.stringify(opt.igCaption).replace(/"/g,'&quot;')})">複製</button>
        </div>
        <div class="gen-block-text">${escapeHtml(opt.igCaption)}</div>
      </div>

      <div class="gen-block">
        <div class="gen-block-label">
          <span>Threads 文字</span>
          <button class="gen-copy-btn" onclick="copyGenText(this, ${JSON.stringify(opt.threadsText).replace(/"/g,'&quot;')})">複製</button>
        </div>
        <div class="gen-block-text">${escapeHtml(opt.threadsText)}</div>
      </div>

      <div class="gen-block">
        <div class="gen-block-label">
          <span>Reels 口播文字稿</span>
          <button class="gen-copy-btn" onclick="copyGenText(this, ${JSON.stringify(opt.reelsScript).replace(/"/g,'&quot;')})">複製</button>
        </div>
        <div class="gen-block-text">${escapeHtml(opt.reelsScript)}</div>
      </div>

      <button class="gen-save-btn" onclick="saveGeneratedToIdeas(${idx})">存到內容靈感庫</button>
      <button class="gen-back-btn" onclick="backToOptions()">返回，重新選擇</button>
    </div>
  `;
  window._currentPickedOpt = opt;
}

window.backToOptions = function() {
  document.getElementById('gen-selected').innerHTML = '';
  renderOptions(window._genOptions);
}

function escapeHtml(text) {
  return (text || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

window.copyGenText = function(btn, text) {
  navigator.clipboard.writeText(text).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  });
  const original = btn.textContent;
  btn.textContent = '已複製';
  btn.classList.add('copied');
  setTimeout(() => { btn.textContent = original; btn.classList.remove('copied'); }, 2000);
}

window.saveGeneratedToIdeas = async function(idx) {
  const opt = window._currentPickedOpt;
  if (!opt) return;
  const fullDesc = `經文：${opt.fullQuote}\n\n${opt.slides.map((s,i)=>`【第${i+1}張】\n${s}`).join('\n\n')}\n\n【IG文案】\n${opt.igCaption}\n\n【Threads】\n${opt.threadsText}\n\n【Reels稿】\n${opt.reelsScript}`;
  try {
    await addDoc(ideasRef, {
      title: opt.quote,
      tag: '待製作',
      desc: fullDesc,
      createdAt: serverTimestamp(),
    });
    document.getElementById('gen-direction').value = '';
    document.getElementById('gen-selected').innerHTML = '<div class="empty">已存到內容靈感庫！可以去那個分頁查看，或繼續生成下一篇</div>';
  } catch(e) {
    alert('儲存失敗: ' + e.message);
  }
}

window.renderChart = renderChart;
